# Browser-Einstellungen
# headless: false = Browser sichtbar öffnen für manuelles CAPTCHA-Lösen
headless: true

search_criteria:
  max_price: 2200000
  min_rooms: 4.5
  min_area_sqm: 120
  min_parking: 2
  min_outdoor_sqm: 10
  max_travel_time_minutes: 35
  exclude_baurecht: true

  priority_regions:
    tier1:
      - Greifensee
      - Uster
      - Volketswil
      - Schwerzenbach
    tier2:
      - Wädenswil
      - Richterswil
      - Horgen

platforms:
  tier1:
    # Haupt-Plattformen mit besten Daten
    - immoscout24
    - homegate
    - allreal
    - mobimo
  tier2:
    # Sekundäre Plattformen & Aggregatoren
    - newhome
    - comparis
    - flatfox
  tier3:
    # Makler & spezialisierte Plattformen
    - engelvoelkers
    - walde
    - betterhomes
    - troendle
    - neubauprojekte
    - immostreet

notifications:
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
  min_score_to_notify: 60

scheduling:
  tier1_interval_minutes: 15
  tier2_interval_minutes: 60
  tier3_interval_minutes: 360

scraping:
  # Paralleles Scraping: Anzahl gleichzeitiger Scraper
  max_parallel_scrapers: 2
  # Parallel scrapen aktivieren/deaktivieren
  parallel_enabled: false

apis:
  geocoding: nominatim
  transport: sbb
